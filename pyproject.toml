[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brandphantom"
version = "1.0.0"
description = "AI-Powered Digital Risk Protection Platform for Social Media and Mobile App Monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.8.0",
    "pillow>=10.2.0",
    "plotly>=5.20.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["C408", "BLE001", "RUF059", "SIM102", "F841", "RUF012"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

